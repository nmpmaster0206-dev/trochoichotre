function applause(){for(let i=0;i<28;i++){note(320+Math.random()*700,i*.065,.07,'triangle',.09)}note(784,.1,.22,'sine',.32);note(988,.34,.2,'sine',.33);note(1318,.55,.55,'sine',.36)}
function message(t){hint.textContent=t;hint.classList.add('show');clearTimeout(message.timer);message.timer=setTimeout(()=>hint.classList.remove('show'),1200)}
function getDest(item){const group=items.filter(a=>a.answer===item.answer&&a.side===item.side);return destinations[item.answer][item.side][group.findIndex(a=>a.id===item.id)]}
function drawPort(x,y,c,r=10){return el('circle',{cx:x,cy:y,r,fill:c,class:'port'},ports)}
function redraw(){lines.replaceChildren();ports.replaceChildren();items.forEach(it=>{let x=it.side==='L'?449:957;drawPort(x,it.y,done.has(it.id)?'#53d782':'#ff1686',11);});for(const ch of ['s','x'])for(const side of ['L','R'])destinations[ch][side].forEach(([x,y])=>drawPort(x,y,ch==='s'?'#ff278a':'#9c28e7',8));items.filter(it=>done.has(it.id)).forEach(it=>{const x=it.side==='L'?449:957,y=it.y,[dx,dy]=getDest(it),bend=it.side==='L'?x+55:x-55,bend2=it.side==='L'?dx-65:dx+65;el('path',{d:`M ${x} ${y} C ${bend} ${y}, ${bend2} ${dy}, ${dx} ${dy}`,class:'line',stroke:it.answer==='s'?'#f51b83':'#8d2bea'},lines)});if(preview)el('path',{d:`M ${preview.x} ${preview.y} L ${preview.toX} ${preview.toY}`,stroke:'#ffac28','stroke-width':5,'stroke-dasharray':'10 9','stroke-linecap':'round',fill:'none'},lines);if(chosen){const it=items.find(x=>x.id===chosen);let x=it.side==='L'?449:957;el('circle',{cx:x,cy:it.y,r:18,fill:'none',stroke:'#ffda30','stroke-width':5},ports)}
score.replaceChildren();el('rect',{x:605,y:363,width:210,height:54,rx:25,fill:'#fffdf7'},score);const txt=el('text',{x:708,y:400,'text-anchor':'middle','font-size':38,'font-weight':900,'font-family':'Trebuchet MS,system-ui,sans-serif',fill:'#f5298a',stroke:'#fff','stroke-width':1},score);txt.textContent='Điểm: '+done.size*10}
function select(it){if(done.has(it.id))return;chosen=it.id;redraw();message('Hãy chạm vào chữ s hoặc x nhé!')}
function match(letter){if(!chosen){message('Con hãy chọn một hình trước nhé!');return}const it=items.find(a=>a.id===chosen);if(it.answer===letter){done.add(it.id);correct();chosen=null;redraw();if(done.size===8)message('Giỏi quá! Bấm Kiểm tra nhé!')}else{wrong();chosen=null;redraw();message('Chưa đúng, con thử lại nhé!')}}
function hit(x,y){if(y>=935){if(x<490)return 'restart';if(x<895)return 'check';return 'next'}if(y<135&&x<150)return 'restart';if(y<145&&x>1240)return 'mute';if(x>=585&&x<=815&&y>=445&&y<=850)return y<650?'s':'x';for(const it of items){const min=it.side==='L'?52:960,max=it.side==='L'?452:1355;if(x>=min&&x<=max&&Math.abs(y-it.y)<63)return it}return null}
function restart(){done.clear();chosen=null;preview=null;overlay.classList.remove('show');redraw();message('Bắt đầu nối hình với chữ nhé!')}
function celebrate(){overlay.classList.add('show');applause();for(let i=0;i<45;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'%';d.style.background=['#f72585','#fcd42b','#70d54b','#a834ef','#2acaf2'][i%5];d.style.animationDelay=Math.random()*.7+'s';document.querySelector('#stage').appendChild(d);setTimeout(()=>d.remove(),3200)}}
function check(){if(done.size===8)celebrate();else{wrong();message('Con còn '+(8-done.size)+' hình chưa nối nhé!')}}
function act(h){if(!h)return;if(typeof h==='object'){select(h);return}if(h==='s'||h==='x')match(h);if(h==='restart')restart();if(h==='check'||h==='next')check();if(h==='mute'){mute=!mute;message(mute?'Đã tắt âm thanh':'Đã bật âm thanh')}}
// iPad Safari: handle native touch events directly; desktop uses Pointer Events.
function beginInput(x,y){
  try{initAudio()}catch(err){console.warn('Audio unavailable',err)}
  const p=point({clientX:x,clientY:y}),h=hit(p.x,p.y);
  drag={h,start:p,moved:false};
  if(h&&typeof h==='object'&&!done.has(h.id)){chosen=h.id;redraw()}
}
function moveInput(x,y){
  if(!drag||!drag.h||typeof drag.h!=='object')return;
  const p=point({clientX:x,clientY:y});
  if(Math.hypot(p.x-drag.start.x,p.y-drag.start.y)>12){
    drag.moved=true;
    preview={x:drag.h.side==='L'?449:957,y:drag.h.y,toX:p.x,toY:p.y};redraw()
  }
}
function endInput(x,y){
  if(!drag)return;
  const p=point({clientX:x,clientY:y}),h=hit(p.x,p.y),origin=drag.h,wasMoved=drag.moved;
  drag=null;preview=null;
  if(wasMoved&&origin&&typeof origin==='object'){
    chosen=origin.id;
    if(h==='s'||h==='x')match(h);
    else{chosen=null;redraw();message('Hãy kéo đến chữ s hoặc x nhé!')}
  }else act(h);
  redraw()
}
function cancelInput(){drag=null;preview=null;redraw()}
// Touch Events are used on iPad, including older Safari versions.
let lastTouch=0;
svg.addEventListener('touchstart',e=>{
  if(!e.changedTouches.length)return;
  lastTouch=Date.now();e.preventDefault();
  const t=e.changedTouches[0];beginInput(t.clientX,t.clientY)
},{passive:false});
svg.addEventListener('touchmove',e=>{
  if(!e.changedTouches.length)return;
  e.preventDefault();const t=e.changedTouches[0];moveInput(t.clientX,t.clientY)
},{passive:false});
svg.addEventListener('touchend',e=>{
  if(!e.changedTouches.length)return;
  e.preventDefault();const t=e.changedTouches[0];endInput(t.clientX,t.clientY)
},{passive:false});
svg.addEventListener('touchcancel',e=>{e.preventDefault();cancelInput()},{passive:false});
svg.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'||Date.now()-lastTouch<700)return;
  beginInput(e.clientX,e.clientY);
  try{svg.setPointerCapture(e.pointerId)}catch(err){}
});
svg.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'||Date.now()-lastTouch<700)return;
  moveInput(e.clientX,e.clientY)
});
svg.addEventListener('pointerup',e=>{
  if(e.pointerType==='touch'||Date.now()-lastTouch<700)return;
  endInput(e.clientX,e.clientY)
});
svg.addEventListener('pointercancel',e=>{if(e.pointerType!=='touch')cancelInput()});
document.querySelector('#again').addEventListener('click',()=>{initAudio();restart()});redraw();
</script></body></html>
